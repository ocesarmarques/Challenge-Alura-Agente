services:
  imobia:
    build:
      context: ..
      dockerfile: Dockerfile
    image: imobia:latest
    container_name: imobia
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env.production
    volumes:
      - imobia_vector_store:/app/data/vector_store
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8501/_stcore/health',
          timeout=4)
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 120s

volumes:
  imobia_vector_store:
